name: Welcome Contributor

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome New Issue (Idea)
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = `👋 Hello @${context.payload.issue.user.login}!\n\nThank you for submitting this idea to **Incubator**! We're excited to see your contribution. \n\nThe community will review and discuss your idea shortly. Feel free to join the ongoing conversations in the [Discussions tab](https://github.com/${context.repo.owner}/${context.repo.repo}/discussions).\n\nStart from Incubator. Build without limits. 🚀`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });

      - name: Welcome New Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = `🎉 Welcome @${context.payload.pull_request.user.login}!\n\nThank you so much for your pull request! We really appreciate your effort in helping build **Incubator**. \n\nA maintainer will review your code as soon as possible. Please make sure your PR follows our contributing guidelines and all tests pass.\n\nStart from Incubator. Build without limits. ✨`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
