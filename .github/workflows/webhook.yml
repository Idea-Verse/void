name: Discord Announcements

on:
  discussion:
    types: [created]
  pull_request:
    types: [opened, closed]

jobs:
  discord-notify:
    name: Post to Discord Announcement Channel
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Webhook Notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          DISCUSSION_BODY: ${{ github.event.discussion.body }}
          DISCUSSION_URL: ${{ github.event.discussion.html_url }}
          DISCUSSION_AUTHOR: ${{ github.event.discussion.user.login }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "⚠️ DISCORD_WEBHOOK_URL secret is not set. Skipping notification."
            exit 0
          fi

          EVENT_NAME="${{ github.event_name }}"
          ACTION="${{ github.event.action }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # 1. Pull Request Closed / Merged
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$ACTION" = "closed" ]; then
            if [ "$PR_MERGED" != "true" ]; then
              echo "ℹ️ Pull request was closed without being merged. Skipping."
              exit 0
            fi
            TITLE="🚀 PR Merged: #${PR_NUMBER} — ${PR_TITLE}"
            URL="$PR_URL"
            AUTHOR="$PR_AUTHOR"
            EVENT_LABEL="PR Merged 🚀"
            COLOR=5763719 # Green (0x57F287)
            BODY_PREVIEW="$PR_BODY"

          # 2. Pull Request Opened
          elif [ "$EVENT_NAME" = "pull_request" ] && [ "$ACTION" = "opened" ]; then
            TITLE="🔀 New PR Opened: #${PR_NUMBER} — ${PR_TITLE}"
            URL="$PR_URL"
            AUTHOR="$PR_AUTHOR"
            EVENT_LABEL="New PR 🔀"
            COLOR=3447003 # Blue (0x3498DB)
            BODY_PREVIEW="$PR_BODY"

          # 3. Discussion Created
          elif [ "$EVENT_NAME" = "discussion" ] && [ "$ACTION" = "created" ]; then
            TITLE="💡 New Discussion: ${DISCUSSION_TITLE}"
            URL="$DISCUSSION_URL"
            AUTHOR="$DISCUSSION_AUTHOR"
            EVENT_LABEL="New Discussion 💡"
            COLOR=15844367 # Gold (0xF1C40F)
            BODY_PREVIEW="$DISCUSSION_BODY"

          else
            echo "ℹ️ Event type not targeted. Skipping."
            exit 0
          fi

          # Truncate preview if too long
          if [ ${#BODY_PREVIEW} -gt 280 ]; then
            BODY_PREVIEW="${BODY_PREVIEW:0:277}..."
          fi

          # Author URLs
          AUTHOR_URL="https://github.com/${AUTHOR}"
          AUTHOR_AVATAR="https://github.com/${AUTHOR}.png"

          # Build Discord Webhook Payload using jq safely
          PAYLOAD=$(jq -n \
            --arg username "OriginDock Incubator" \
            --arg content "$TITLE" \
            --arg title "$TITLE" \
            --arg url "$URL" \
            --arg author "$AUTHOR" \
            --arg author_avatar "$AUTHOR_AVATAR" \
            --arg author_url "$AUTHOR_URL" \
            --arg repo "${{ github.repository }}" \
            --arg event_label "$EVENT_LABEL" \
            --arg desc "$BODY_PREVIEW" \
            --arg timestamp "$TIMESTAMP" \
            --argjson color "$COLOR" \
            '{
              username: $username,
              content: $content,
              embeds: [{
                title: $title,
                url: $url,
                description: (if $desc != "" then $desc else "No description provided." end),
                color: $color,
                author: {
                  name: $author,
                  icon_url: $author_avatar,
                  url: $author_url
                },
                fields: [
                  { name: "Repository", value: $repo, inline: true },
                  { name: "Event Type", value: $event_label, inline: true }
                ],
                footer: {
                  text: "OriginDock Incubator • GitHub"
                },
                timestamp: $timestamp
              }]
            }')

          # Send HTTP POST to Discord Webhook and output HTTP response status
          HTTP_STATUS=$(curl -s -o /tmp/discord_resp.json -w "%{http_code}" \
               -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               "$DISCORD_WEBHOOK_URL")

          echo "Response HTTP Status: $HTTP_STATUS"
          cat /tmp/discord_resp.json
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 204 ]; then
            echo "❌ Discord webhook POST failed with status $HTTP_STATUS!"
            exit 1
          fi

          echo "✅ Discord announcement sent successfully!"
