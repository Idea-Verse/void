name: "💡 Submit an Idea"
description: "Share your idea with the community"
title: "[IDEA] "
labels: ["idea: new"]
body:
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Feature
        - Tool
        - Integration
        - Design
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem_statement
    attributes:
      label: Problem Statement
      description: What problem does this idea solve?
      placeholder: Describe the problem...
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe your idea in detail
      placeholder: Explain how your idea solves the problem...
    validations:
      required: true
  - type: input
    id: target_audience
    attributes:
      label: Target Audience
      description: Who would benefit from this?
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - 🟢 Nice to Have
        - 🟡 Important
        - 🔴 Critical
    validations:
      required: true
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about the idea here.
    validations:
      required: false
  - type: checkboxes
    id: willing_to_implement
    attributes:
      label: Willing to Implement
      options:
        - label: I'm willing to work on implementing this idea
          required: false
